# ReproLab local stack. Start: `docker compose up --build -d` (after `cp .env.example .env`).
#
# Networks:
#   core    - internal only: database, broker, API and workers.
#   sandbox - internal only: investigation worker <-> demo targets and the test runner.
#   edge    - normal bridge: published ports and outbound calls (model provider, public GitHub).
# The browser's origin allowlist is enforced in code on every request; see docs/SECURITY.md for the
# remaining egress gap and the planned proxy for public deployments.

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reprolab}:${POSTGRES_PASSWORD:-reprolab}@postgres:5432/${POSTGRES_DB:-reprolab}
    REDIS_URL: redis://redis:6379/0
    ARTIFACTS_DIR: /data/artifacts
    TEST_RUNNER_URL: http://test-runner:4300

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reprolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reprolab}
      POSTGRES_DB: ${POSTGRES_DB:-reprolab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reprolab}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    networks: [core]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    <<: *backend-env
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile, target: app }
    image: reprolab-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m reprolab.db.seed"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]
    restart: "no"

  api:
    <<: *backend-env
    image: reprolab-backend:local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - artifacts:/data/artifacts
    networks: [core, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 10

  worker-indexing:
    <<: *backend-env
    image: reprolab-backend:local
    command: ["celery", "-A", "reprolab.workers.celery_app", "worker", "-Q", "indexing", "--concurrency", "1", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - models:/home/reprolab/.cache
      # Operator-exported snapshots (`git archive` of the indexable paths only). Read-only;
      # neither .git nor benchmarks/ground-truth is ever mounted here.
      - ./data/snapshots:/snapshots:ro
    networks: [core, edge]

  worker-investigation:
    <<: *backend-env
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile, target: browser }
    image: reprolab-browser-worker:local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      demo-target: { condition: service_started }
      test-runner: { condition: service_started }
    # Lets LLM_BASE_URL=http://host.docker.internal:11434/v1 reach a model server on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - artifacts:/data/artifacts
    # Chromium sandbox stays on; the Playwright image's seccomp guidance applies (docs/SECURITY.md).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ipc: private
    shm_size: 1gb
    networks: [core, sandbox, edge]

  demo-target:
    build: { context: ., dockerfile: infra/docker/demo-target.Dockerfile }
    image: reprolab-demo-target:local
    environment:
      DEMO_FIXTURE_MODE: buggy
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?set DEMO_ADMIN_TOKEN in .env}
    ports: ["4173:4173"]
    networks: [sandbox, edge]

  demo-target-fixed:
    image: reprolab-demo-target:local
    environment:
      DEMO_FIXTURE_MODE: fixed
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?set DEMO_ADMIN_TOKEN in .env}
    depends_on: [demo-target]
    ports: ["4174:4173"]
    networks: [sandbox, edge]

  test-runner:
    build: { context: ., dockerfile: infra/docker/test-runner.Dockerfile }
    image: reprolab-test-runner:local
    environment:
      BUGGY_URL: http://demo-target:4173
      FIXED_URL: http://demo-target-fixed:4173
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?set DEMO_ADMIN_TOKEN in .env}
    depends_on: [demo-target, demo-target-fixed]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ipc: private
    shm_size: 1gb
    networks: [sandbox]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    networks: [edge]

networks:
  core:
    internal: true
  sandbox:
    internal: true
  edge: {}

volumes:
  pgdata:
  artifacts:
  models:
