name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Offline only: no provider keys, no billed model calls.
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: reprolab
          POSTGRES_PASSWORD: reprolab
          POSTGRES_DB: reprolab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reprolab" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://reprolab:reprolab@localhost:5432/reprolab_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo-target:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: demo-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo-target/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify-oracles -- --runs 2

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
